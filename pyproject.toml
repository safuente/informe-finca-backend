[project]
name = "informe-finca-backend"
version = "0.1.0"
description = "informefinca.es — API de informes de due diligence de fincas rústicas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "geoalchemy2>=0.16",
    "shapely>=2.0",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "jinja2>=3.1",
    "weasyprint>=63.0",
    "stripe>=11.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

# FastAPI CLI / VS Code extension entrypoint — no hardcoded path needed.
[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
