services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - reports_data:/data/reports
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Report generation runs out of band: the Stripe webhook must answer in milliseconds.
  worker:
    build: .
    command: uv run celery -A app.core.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    volumes:
      - .:/app
      - reports_data:/data/reports
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    # postgis/postgis solo publica amd64: en Apple Silicon corre emulado y las cargas
    # masivas se vuelven inviables (medido: ST_Subdivide 24x más lento, 3h contra 8 min
    # para las láminas del SNCZI). imresamu/postgis es la misma versión compilada también
    # para arm64, así que basta con POSTGIS_IMAGE en .env y el volumen sigue sirviendo.
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  reports_data:
