name: CI y despliegue

# En cada push a main —que es lo que ocurre al mergear— y en cada pull request. La diferencia
# está en el job de despliegue, que solo corre en main: en las PR se valida, no se publica.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Dos despliegues a la vez sobre el mismo servidor se pisarían a mitad de construcción.
# cancel-in-progress en false a propósito: un despliegue empezado se termina, no se aborta
# dejando los contenedores a medio recambiar.
concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests y ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen: usa uv.lock tal cual y falla si pyproject.toml se ha movido sin
      # regenerarlo. Así CI prueba exactamente las versiones que va a instalar el servidor.
      - run: uv sync --frozen

      - run: uv run ruff check .

      # La suite no necesita Postgres ni Redis: conftest.py monta el cliente sin lifespan.
      # Por eso este job no lleva `services:` y tarda segundos.
      - run: uv run pytest -q

  deploy:
    name: Desplegar en el VPS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # known_hosts va en un secreto en vez de usar ssh-keyscan al vuelo: aceptar la huella
      # que devuelva quien conteste es confiar en la red del runner. Con la huella fijada, un
      # servidor suplantado hace fallar el despliegue en lugar de recibir el push.
      - name: Configurar la clave SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # El script viaja desde el checkout, así que se ejecuta la versión de este commit y no
      # la que hubiera en el servidor.
      - name: Desplegar
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              "root@${{ secrets.DEPLOY_HOST }}" \
              'bash -s' < scripts/deploy/remote.sh

      # Comprobación de extremo a extremo, y por el dominio público: pasa por DNS, por el
      # certificado de Caddy y por la aplicación. Si algo de esa cadena se rompió, el
      # despliegue queda en rojo en vez de parecer correcto.
      - name: Comprobar que la API responde
        run: |
          for intento in $(seq 1 20); do
            if curl -fsS https://api.informefinca.es/health | grep -q '"ok"'; then
              echo "API sana tras $intento intento(s)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::La API no respondió sana en 100 s tras el despliegue." >&2
          exit 1
